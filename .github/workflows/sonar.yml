name: SonarCloud Analysis

on:
  push:
    branches:
      - master
      - certification
      - developer
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Scan + Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Forzamos la eliminación de ambos para evitar colisiones en pip
          pip uninstall -y multipart python-multipart || true
          # Instalamos los requirements primero
          pip install -r requirements.txt
          # Forzamos la instalación limpia y explícita de python-multipart al final
          pip install --force-reinstall python-multipart
          pip install pytest pytest-cov

      - name: Run tests with coverage (genera coverage.xml para SonarCloud)
        run: |
          pytest tests/ -v \
            --cov=mlops_pipeline/src \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            --junitxml=pytest-report.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          