# SonarCloud configuration - Pipeline MLOps Credito M5
# ======================================================
# Para que funcione, registrar el repo en https://sonarcloud.io y obtener:
#   - sonar.organization (organization key)
#   - sonar.projectKey (project key)
# Luego configurar la variable secreta SONAR_TOKEN en GitHub > Settings > Secrets.

sonar.organization=anastasiaganderats
sonar.projectKey=anastasiaganderats_mlops_credito_m5
sonar.projectName=Pipeline MLOps Credito - Modulo 5 Henry
sonar.projectVersion=1.1.1

# Language
sonar.language=py
sonar.python.version=3.10

# Fuentes a analizar
sonar.sources=mlops_pipeline/src,streamlit_app
sonar.tests=tests

# Reporte de cobertura (lo genera pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=pytest-report.xml

# Exclusiones
sonar.exclusions=**/__pycache__/**,**/*.ipynb,**/*-venv/**,**/migrations/**,**/data_processed/**,**/models/**,docs/**
sonar.test.exclusions=**/conftest.py
sonar.coverage.exclusions=**/__init__.py,**/test_*.py,**/conftest.py

# Encoding
sonar.sourceEncoding=UTF-8

# Quality gate - reglas minimas que el codigo debe cumplir
# (estos son los defaults razonables; ajustar segun politica de la organizacion)
# Coverage minimo 30%
# Duplicated lines maximo 5%
# Maintainability rating A o B
